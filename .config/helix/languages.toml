#:schema https://penzulo.dev/schemas/helix-languages.json

[language-server.biome]
command = "biome"
args = ["lsp-proxy"]

[language-server.clangd]
command = "clangd"

[language-server.clangd.config]
fallbackFlags = ["-std=c++23"]

[language-server.marksman]
command = "marksman"
args = ["server"]

[language-server.ty]
command = "ty"
args = ["server"]

[language-server.vtsls]
command = "vtsls"
args = ["--stdio"]

[language-server.vtsls.config.typescript.tsserver]
maxTsServerMemory = 8_192
logVerbosity = "off"

[language-server.vtsls.config.typescript.preferences]
includePackageJsonAutoImports = "auto"
preferTypeOnlyAutoImports = true

[language-server.vtsls.config.typescript.suggest]
autoImports = true

[language-server.vtsls.config.typescript.inlayHints.parameterNames]
enabled = "none"

[language-server.vtsls.config.typescript.inlayHints.variableTypes]
enabled = false

[language-server.vtsls.config.typescript.inlayHints.returnTypes]
enabled = false

[language-server.vtsls.config.typescript.experimental]
enableProjectDiagnostics = false

[language-server.vscode-json-languageserver]
command = "vscode-json-languageserver"
args = ["--stdio"]

[language-server.vscode-json-languageserver.config]
provideFormatter = true

[language-server.vscode-json-languageserver.config.json.validate]
enable = true

[[language-server.vscode-json-languageserver.config.json.schemas]]
fileMatch = ["package.json"]
url = "https://json.schemastore.org/package.json"

[[language-server.vscode-json-languageserver.config.json.schemas]]
fileMatch = ["tsconfig.json", "tsconfig.*.json"]
url = "https://json.schemastore.org/tsconfig.json"

[[language-server.vscode-json-languageserver.config.json.schemas]]
fileMatch = ["turbo.json"]
url = "https://turbo.build/schema.json"

[[language]]
name = "python"
scope = "source.python"
injection-regex = "py(thon)?"
shebangs = [
  "python",
  "uv",
]
roots = [
  "pyproject.toml",
  "setup.py",
  "uv.lock",
  "poetry.lock",
  "pyrightconfig.json",
  "requirements.txt",
]
comment-token = "#"
language-servers = [
  "ty",
  "ruff",
]
auto-format = true
file-types = [
  "py",
  "pyi",
  "py3",
  "pyw",
  "ptl",
  "rpy",
  "cpy",
  "ipy",
  "pyt",
  { glob = ".python_history" },
  { glob = ".pythonstartup" },
  { glob = ".pythonrc" },
  { glob = "*SConstruct" },
  { glob = "*SConscript" },
  { glob = "*sconstruct" },
]

[language.indent]
tab-width = 4
unit = "    "

[language.formatter]
command = "ruff"
args = ["format", "--stdin-filename", "{buffer_path}"]

[[language]]
name = "javascript"
scope = "source.js"
injection-regex = "(js|javascript)"
language-id = "javascript"
file-types = ["js", "mjs", "cjs", "rules", "es6", "pac", { glob = ".node_repl_history" }, { glob = "jakefile" }]
shebangs = ["node"]
roots = ["package.json", "jsconfig.json"]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
auto-format = true
language-servers = [
  { name = "vtsls", except-features = ["format"] },
  "biome",
]

[[language]]
name = "typescript"
scope = "source.ts"
injection-regex = "(ts|typescript)"
language-id = "typescript"
file-types = ["ts", "mts", "cts"]
shebangs = ["deno", "bun", "ts-node"]
roots = ["package.json", "tsconfig.json"]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
auto-format = true
language-servers = [
  { name = "vtsls", except-features = ["format"] },
  "biome",
]

[[language]]
name = "tsx"
scope = "source.tsx"
injection-regex = "(tsx)"
language-id = "typescriptreact"
file-types = ["tsx"]
roots = ["package.json", "tsconfig.json"]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
auto-format = true
language-servers = [
  { name = "vtsls", except-features = ["format"] },
  "biome",
]

[[language]]
name = "jsx"
scope = "source.jsx"
injection-regex = "jsx"
language-id = "javascriptreact"
file-types = ["jsx"]
roots = ["package.json", "jsconfig.json"]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
auto-format = true
language-servers = [
  { name = "vtsls", except-features = ["format"] },
  "biome",
]

[[language]]
name = "json"
scope = "source.json"
injection-regex = "json"
file-types = ["json", "arb", "ipynb", "geojson", "gltf", "webmanifest", { glob = "flake.lock" }, { glob = ".babelrc" }, { glob = ".bowerrc" }, { glob = ".jscrc" }, "js.map", "ts.map", "css.map", { glob = ".jslintrc" }, "jsonl", { glob = ".vuerc" }, { glob = "composer.lock" }, { glob = ".watchmanconfig" }, "avsc", "ldtk", "ldtkl", { glob = ".swift-format" }, "sublime-build", "sublime-color-scheme", "sublime-commands", "sublime-completions", "sublime-keymap", "sublime-macro", "sublime-menu", "sublime-mousemap", "sublime-project", "sublime-settings", "sublime-theme", "sublime-workspace"]
auto-format = true
language-servers = [
  { name = "vscode-json-languageserver", except-features = ["format"] },
  "biome",
]

[[language]]
name = "jsonc"
scope = "source.json"
injection-regex = "jsonc"
file-types = ["jsonc", { glob = "{t,j}sconfig.json" }, { glob = "bun.lock" }]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
grammar = "json"
auto-format = true
language-servers = [
  { name = "vscode-json-languageserver", except-features = ["format"] },
  "biome",
]

[[language]]
name = "c"
scope = "source.c"
injection-regex = "c"
file-types = ["c"]  # WARN: ["h"] files may not be included.
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
indent = { tab-width = 2, unit = "  " }
language-servers = ["clangd"]
formatter = { command = "clang-format", args = ["--style=file"] }
auto-format = true

[[language]]
name = "cpp"
scope = "source.cpp"
injection-regex = "cpp"
file-types = ["cc", "hh", "c++", "cpp", "hpp", "h", "ipp", "tpp", "cxx", "hxx", "ixx", "txx", "ino", "C", "H", "cu", "cuh", "cppm", "h++", "ii", "inl", { glob = ".hpp.in" }, { glob = ".h.in" }]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
indent = { tab-width = 2, unit = "  " }
language-servers = ["clangd"]
formatter = { command = "clang-format", args = ["--style=file"] }
auto-format = true

[[language]]
name = "markdown"
scope = "source.md"
injection-regex = "md|markdown"
file-types = ["md", "livemd", "markdown", "mdx", "mkd", "mkdn", "mdwn", "mdown", "markdn", "mdtxt", "mdtext", "workbook", { glob = "PULLREQ_EDITMSG" }]
roots = [".marksman.toml"]
language-servers = ["marksman", "markdown-oxide", "rumdl"]
indent = { tab-width = 2, unit = "  " }
block-comment-tokens = { start = "<!--", end = "-->" }

[[language]]
name = "toml"
auto-format = true
language-servers = ["tombi"]

[language.auto-pairs]
"(" = ")"
"{" = "}"
"[" = "]"
"<" = ">"
'"' = '"'
"'" = "'"
"`" = "`"
"‘" = "’"
"«" = "»"
"“" = "”"

[[language]]
name = "cpp"
